# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build devpod image
on:
  pull_request:
    paths:
      - images/devpod/**
      - .github/workflows/build-devpod-image.yaml
  push:
    branches:
      - main
    paths:
      - images/devpod/**
      - .github/workflows/build-devpod-image.yaml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: devpod-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate image version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          image_version="$(tr -d '[:space:]' < images/devpod/VERSION)"
          if [[ ! "${image_version}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "images/devpod/VERSION must use YYYY.MM.DD.REVISION format" >&2
            exit 1
          fi

          expected_tag="ubuntu-24.04-${image_version}"
          configured_tag="$(awk '$1 == "tag:" { print $2; exit }' apps/homelab/devpod/values.yaml)"
          if [[ "${configured_tag}" != "${expected_tag}" ]]; then
            echo "apps/homelab/devpod/values.yaml must use tag ${expected_tag}" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]] \
              && ! git diff --quiet "${BASE_SHA}"...HEAD -- images/devpod ':(exclude)images/devpod/VERSION' \
              && git diff --quiet "${BASE_SHA}"...HEAD -- images/devpod/VERSION; then
            echo "Bump images/devpod/VERSION when changing the image build context" >&2
            exit 1
          fi

          echo "value=${image_version}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dtavana/homelab-devpod
          tags: |
            type=raw,value=ubuntu-24.04-${{ steps.version.outputs.value }}
            type=sha,format=long
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./images/devpod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
