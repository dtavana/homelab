# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build devpod image
on:
  pull_request:
    paths:
      - images/devpod/**
      - .github/workflows/build-devpod-image.yaml
  push:
    branches:
      - main
    paths:
      - images/devpod/**
      - .github/workflows/build-devpod-image.yaml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: devpod-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dtavana/homelab-devpod
          tags: |
            type=sha,format=long
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./images/devpod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select the published image in GitOps
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i -E "s/^([[:space:]]*tag: ).*/\1${IMAGE_TAG}/" apps/homelab/devpod/values.yaml
      - name: Commit the immutable image tag
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: deploy devpod image ${{ github.sha }}"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
