controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/dtavana/homelab-devpod
          # Must match ubuntu-24.04-<images/devpod/VERSION>.
          tag: ubuntu-24.04-2026.09.13.2
          pullPolicy: Always
        env:
          CODEX_HOME: /home/dev/.codex
          DEFAULT_REPOSITORIES_JSON: >-
            [{"url":"https://github.com/dtavana/homelab.git","path":"/home/dev/src/homelab","ref":"main"}]
          HOME: /home/dev
          KUBECONFIG: /etc/devpod/kubeconfig
          TZ: America/New_York
          PUBLIC_KEY_URL: https://github.com/dtavana.keys
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
defaultPodOptions:
  automountServiceAccountToken: true
serviceAccount:
  create: false
  name: devpod-admin
service:
  main:
    controller: main
    type: LoadBalancer
    loadBalancerIP: 192.168.0.35
    externalTrafficPolicy: Local
    loadBalancerSourceRanges:
      - 10.5.5.0/24
      - 192.168.0.0/24
    ports:
      ssh:
        port: 2222
        targetPort: 2222
        protocol: TCP
persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 30Gi
    retain: true
    globalMounts:
      - path: /home/dev
