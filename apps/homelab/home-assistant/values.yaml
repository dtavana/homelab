hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: "10Gi"
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: "hass.dtavana.dev"
      paths:
        - path: /
          pathType: Prefix
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - "10.42.0.0/16"
    - "10.43.0.0/16"
    - "10.10.10.11/32"
    - "10.10.10.12/32"
    - "10.10.10.13/32"
env:
  - name: TZ
    value: "America/New_York"
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
initContainers:
  - name: install-hacs
    # renovate: datasource=docker depName=alpine
    image: alpine:3.22
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        # renovate: datasource=github-releases depName=hacs/integration
        HACS_VERSION="2.0.5"
        HACS_DIR="/config/custom_components/hacs"
        HACS_VERSION_FILE="$HACS_DIR/.hacs-version"
        if [ -f "$HACS_VERSION_FILE" ] && [ "$(cat "$HACS_VERSION_FILE")" = "$HACS_VERSION" ]; then
          echo "HACS $HACS_VERSION is already installed, skipping."
        else
          echo "Installing HACS $HACS_VERSION..."
          apk add --no-cache wget unzip
          rm -rf "$HACS_DIR"
          mkdir -p $(dirname "$HACS_DIR")
          wget -O /tmp/hacs.zip "https://github.com/hacs/integration/releases/download/${HACS_VERSION}/hacs.zip"
          unzip /tmp/hacs.zip -d "$HACS_DIR"
          printf '%s\n' "$HACS_VERSION" > "$HACS_VERSION_FILE"
          rm /tmp/hacs.zip
          echo "HACS installation complete."
        fi
    volumeMounts:
      - name: hass-system-home-assistant
        mountPath: /config
