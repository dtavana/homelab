podAnnotations:
  fp400-installer-revision: "sha256:27c993e95c5e2bc87ba4dbb8698965b45018dd103b6574ab3a5e5e239b283804"
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: "10Gi"
ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: "hass.dtavana.dev"
      paths:
        - path: /
          pathType: Prefix
configuration:
  enabled: true
  forceInit: true
  trusted_proxies:
    - "10.42.0.0/16"
    - "10.43.0.0/16"
    - "10.10.10.11/32"
    - "10.10.10.12/32"
    - "10.10.10.13/32"
env:
  - name: TZ
    value: "America/New_York"
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 30
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-node-1
additionalVolumes:
  - name: home-assistant-fp400-installer
    configMap:
      name: home-assistant-fp400-installer
initContainers:
  - name: install-hacs
    image: alpine:latest
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        HACS_DIR="/config/custom_components/hacs"
        if [ -d "$HACS_DIR" ]; then
          echo "HACS is already installed, skipping."
        else
          echo "Installing HACS..."
          apk add --no-cache wget unzip
          mkdir -p $(dirname "$HACS_DIR")
          wget -O /tmp/hacs.zip https://github.com/hacs/integration/releases/latest/download/hacs.zip
          unzip /tmp/hacs.zip -d "$HACS_DIR"
          rm /tmp/hacs.zip
          echo "HACS installation complete."
        fi
    volumeMounts:
      - name: hass-system-home-assistant
        mountPath: /config
  - name: install-aqara-fp400
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    imagePullPolicy: IfNotPresent
    command: ["python3", "/run/fp400-installer/install_fp400.py"]
    args: ["install"]
    volumeMounts:
      - name: hass-system-home-assistant
        mountPath: /config
      - name: home-assistant-fp400-installer
        mountPath: /run/fp400-installer
        readOnly: true
